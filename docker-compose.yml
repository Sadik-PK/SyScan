services:
  postgres:
    image: postgres:16-alpine
    container_name: syscan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: syscan
      POSTGRES_USER: syscan
      POSTGRES_PASSWORD: syscan_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syscan -d syscan"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: syscan-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@syscan.internal
      PGADMIN_DEFAULT_PASSWORD: admin_dev_password
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
